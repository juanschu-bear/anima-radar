[project]
name = "anima-radar-api"
version = "0.1.0"
description = "AnimaRadar discovery and outreach pipeline"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.84.0",
  "fastapi>=0.128.8",
  "httpx>=0.28.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.13.1",
  "supabase>=2.31.0",
  "uvicorn[standard]>=0.40.0"
]

[project.scripts]
radar-api = "app.main:run"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
typeCheckingMode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
